name: Monitor Pages deployment queue

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

permissions:
  actions: read

jobs:
  check_deploy_queue:
    name: Check queued Pages deployments
    runs-on: ubuntu-latest
    timeout-minutes: 3

    steps:
      - name: Flag deployments queued for more than 20 minutes
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          python3 - <<'PY'
          from datetime import datetime, timezone
          from urllib.error import HTTPError, URLError
          from urllib.request import Request, urlopen
          import json
          import os
          import sys

          repository = os.environ["REPOSITORY"]
          token = os.environ["GH_TOKEN"]

          def api_get(path):
              request = Request(
                  f"https://api.github.com/repos/{repository}/{path}",
                  headers={
                      "Accept": "application/vnd.github+json",
                      "Authorization": f"Bearer {token}",
                      "X-GitHub-Api-Version": "2022-11-28",
                  },
              )
              with urlopen(request, timeout=20) as response:
                  return json.load(response)

          now = datetime.now(timezone.utc)
          runs = api_get("actions/runs?per_page=100&branch=main")["workflow_runs"]
          stale = []

          for run in runs:
              if run.get("name") != "Update BBLCA events feeds":
                  continue
              if run.get("status") not in ("queued", "in_progress"):
                  continue

              jobs = api_get(f"actions/runs/{run['id']}/jobs?per_page=100")["jobs"]
              build = next((job for job in jobs if job.get("name") == "build"), None)
              deploy = next((job for job in jobs if job.get("name") == "deploy"), None)
              if not build or not deploy or build.get("conclusion") != "success":
                  continue
              if deploy.get("status") != "queued":
                  continue

              queued_since = build.get("completed_at")
              if not queued_since:
                  continue
              queued_at = datetime.fromisoformat(queued_since.replace("Z", "+00:00"))
              minutes = (now - queued_at).total_seconds() / 60
              if minutes >= 20:
                  stale.append((run["id"], run.get("html_url"), minutes))

          if stale:
              for run_id, url, minutes in stale:
                  message = (
                      f"Pages deploy job for Actions run {run_id} has been queued "
                      f"for {minutes:.0f} minutes. Live files may still be stale. "
                      f"Run: {url}"
                  )
                  print(f"::error title=Pages deploy queue delay::{message}")
              sys.exit(1)

          print("No Pages deployment has been queued for more than 20 minutes.")
          PY
