name: Update BBLCA events feeds

on:
  workflow_dispatch:
  schedule:
    - cron: '17 */6 * * *'

concurrency:
  group: bblca-events-feed
  cancel-in-progress: false

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Download repository
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - name: Sync with latest repository changes
        run: git pull --rebase origin main

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Update BBLCA calendar feeds
        run: python make_feed.py

      - name: Add landing page
        run: |
          mkdir -p docs
          if [ -f index.html ]; then
            cp index.html docs/index.html
          fi

      - name: Save updated events
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add docs/feed.xml docs/events.ics docs/index.html state.json

          if git diff --staged --quiet; then
            echo "No calendar changes to save."
          else
            git commit -m "Update BBLCA events"
            git push origin main
          fi

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload website
        uses: actions/upload-pages-artifact@v4
        with:
          path: docs

  deploy:
    needs: build
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Publish website
        id: deployment
        uses: actions/deploy-pages@v4