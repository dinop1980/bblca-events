name: Update BBLCA events feeds

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/feed.yml"
      - "make_feed.py"
  workflow_dispatch:
  schedule:
    - cron: '17 */6 * * *'

concurrency:
  group: bblca-events-rss
  cancel-in-progress: false

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Download repository
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Generate and save updated events
        shell: bash
        run: |
          set -e

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          for attempt in 1 2 3 4 5; do
            echo "Update attempt $attempt"

            # Begin each attempt with the latest version of main.
            git fetch origin main
            git checkout -B main origin/main

            # Use one Eastern timestamp for the feed build and the displayed refresh time.
            refreshed_at=$(TZ=America/New_York date +"%Y-%m-%dT%H:%M:%S%:z")

            # Generate the newest feeds and save the same data at the repository root
            # and in docs, which GitHub Pages publishes.
            python make_feed.py --now "$refreshed_at"

            # Record the successful refresh in the tracked source page.
            python - "$refreshed_at" <<'PY'
          from pathlib import Path
          import re
          import sys

          refreshed_at = sys.argv[1]
          page = Path("index.html")
          content = page.read_text(encoding="utf-8")
          pattern = r'(<time id="last-updated-time" datetime=")[^"]+(">)[^<]*(</time>)'
          updated, count = re.subn(
              pattern,
              lambda match: f"{match.group(1)}{refreshed_at}{match.group(2)}{refreshed_at}{match.group(3)}",
              content,
          )
          if count != 1:
              raise SystemExit(f"Expected one refresh-time element, found {count}")
          page.write_text(updated, encoding="utf-8")
          PY

            mkdir -p docs
            cp docs/feed.xml feed.xml
            cp docs/events.ics events.ics
            cp index.html docs/index.html

            git add feed.xml events.ics index.html docs/feed.xml docs/events.ics docs/index.html state.json

            # Continue to deployment when nothing changed.
            if git diff --staged --quiet; then
              echo "The calendar is already current."
              exit 0
            fi

            git commit -m "Update BBLCA events"

            # Finish if the push succeeds.
            if git push origin main; then
              echo "Calendar update saved successfully."
              exit 0
            fi

            echo "Another run updated the repository. Retrying..."
          done

          echo "Unable to save after five attempts."
          exit 1

      - name: Add successful refresh time to published page
        shell: bash
        run: |
          set -e
          refreshed_at=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          grep -q "__LAST_UPDATED_UTC__" docs/index.html
          sed -i "s/__LAST_UPDATED_UTC__/$refreshed_at/g" docs/index.html
          grep -q "$refreshed_at" docs/index.html

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload website
        uses: actions/upload-pages-artifact@v4
        with:
          path: docs

  deploy:
    needs: build
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Publish website
        id: deployment
        uses: actions/deploy-pages@v4
