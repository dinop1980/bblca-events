name: Update BBLCA events feeds

on:
  workflow_dispatch:
  schedule:
    - cron: '17 */6 * * *'

concurrency:
  group: bblca-events-rss
  cancel-in-progress: false

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Download repository
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Generate and save updated events
        shell: bash
        run: |
          set -e

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          for attempt in 1 2 3 4 5; do
            echo "Update attempt $attempt"

            # Begin each attempt with the latest version of main.
            git fetch origin main
            git checkout -B main origin/main

            # Generate the newest BBLCA feeds.
            python make_feed.py

            # Prepare the GitHub Pages folder.
            mkdir -p docs
            if [ -f index.html ]; then
              cp index.html docs/index.html
            fi

            git add docs/feed.xml docs/events.ics docs/index.html state.json

            # Continue to deployment when nothing changed.
            if git diff --staged --quiet; then
              echo "The calendar is already current."
              exit 0
            fi

            git commit -m "Update BBLCA events"

            # Finish if the push succeeds.
            if git push origin main; then
              echo "Calendar update saved successfully."
              exit 0
            fi

            echo "Another run updated the repository. Retrying..."
          done

          echo "Unable to save after five attempts."
          exit 1

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload website
        uses: actions/upload-pages-artifact@v4
        with:
          path: docs

  deploy:
    needs: build
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Publish website
        id: deployment
        uses: actions/deploy-pages@v4