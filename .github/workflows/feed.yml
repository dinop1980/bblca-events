name: Update BBLCA events feeds

on:
  # Pushes to this workflow file can manually restore a Pages deployment.
  push:
    branches:
      - main
    paths:
      - ".github/workflows/feed.yml"
      - "make_feed.py"
  workflow_dispatch:
  schedule:
    - cron: '17 */6 * * *'

concurrency:
  group: bblca-events-rss
  cancel-in-progress: false

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      index_html: ${{ steps.checksums.outputs.index_html }}
      feed_xml: ${{ steps.checksums.outputs.feed_xml }}
      events_ics: ${{ steps.checksums.outputs.events_ics }}
      committee_board_ics: ${{ steps.checksums.outputs.committee_board_ics }}

    steps:
      - name: Download repository
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Install browser for one-time historical backfill
        if: ${{ hashFiles('history_backfill.json') == '' }}
        run: |
          python -m pip install playwright==1.63.0
          python -m playwright install --with-deps chromium

      - name: Test feed and history parsers
        run: python -m unittest discover -v

      - name: Generate and save updated events
        shell: bash
        run: |
          set -e

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          for attempt in 1 2 3 4 5; do
            echo "Update attempt $attempt"

            # Begin each attempt with the latest version of main.
            git fetch origin main
            git checkout -B main origin/main

            # Use one Eastern timestamp for the feed build and the displayed refresh time.
            refreshed_at=$(TZ=America/New_York date +"%Y-%m-%dT%H:%M:%S%:z")

            # Generate the newest feeds and save the same data at the repository root
            # and in docs, which GitHub Pages publishes.
            python make_feed.py --now "$refreshed_at"

            # Record the successful refresh in the tracked source page.
            python - "$refreshed_at" <<'PY'
          from pathlib import Path
          import re
          import sys

          refreshed_at = sys.argv[1]
          page = Path("index.html")
          content = page.read_text(encoding="utf-8")
          pattern = r'(<time id="last-updated-time" datetime=")[^"]+(">)[^<]*(</time>)'
          updated, count = re.subn(
              pattern,
              lambda match: f"{match.group(1)}{refreshed_at}{match.group(2)}{refreshed_at}{match.group(3)}",
              content,
          )
          if count != 1:
              raise SystemExit(f"Expected one refresh-time element, found {count}")
          page.write_text(updated, encoding="utf-8")
          PY

            mkdir -p docs
            cp docs/feed.xml feed.xml
            cp docs/events.ics events.ics
            cp docs/committee-board-meetings.ics committee-board-meetings.ics
            cp index.html docs/index.html

            git add feed.xml events.ics committee-board-meetings.ics index.html docs/feed.xml docs/events.ics docs/committee-board-meetings.ics docs/index.html state.json history_backfill.json

            # Continue to deployment when nothing changed.
            if git diff --staged --quiet; then
              echo "The calendar is already current."
              break
            fi

            git commit -m "Update BBLCA events"

            # Finish if the push succeeds.
            if git push origin main; then
              echo "Calendar update saved successfully."
              break
            fi

            echo "Another run updated the repository. Retrying..."
            if [ "$attempt" -eq 5 ]; then
              echo "Unable to save after five attempts."
              exit 1
            fi
          done

          # Verify the root source copies and Pages directory contain identical files.
          cmp index.html docs/index.html
          cmp feed.xml docs/feed.xml
          cmp events.ics docs/events.ics
          cmp committee-board-meetings.ics docs/committee-board-meetings.ics

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload website
        uses: actions/upload-pages-artifact@v4
        with:
          path: docs

      - name: Calculate public file checksums
        id: checksums
        shell: bash
        run: |
          set -euo pipefail
          echo "index_html=$(sha256sum docs/index.html | cut -d ' ' -f1)" >> "$GITHUB_OUTPUT"
          echo "feed_xml=$(sha256sum docs/feed.xml | cut -d ' ' -f1)" >> "$GITHUB_OUTPUT"
          echo "events_ics=$(sha256sum docs/events.ics | cut -d ' ' -f1)" >> "$GITHUB_OUTPUT"
          echo "committee_board_ics=$(sha256sum docs/committee-board-meetings.ics | cut -d ' ' -f1)" >> "$GITHUB_OUTPUT"

  deploy:
    needs: build
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Publish website
        id: deployment
        uses: actions/deploy-pages@v4

  verify_public:
    name: Verify public feeds
    needs: [build, deploy]
    runs-on: ubuntu-latest
    timeout-minutes: 12

    steps:
      - name: Confirm public HTML, RSS, and ICS match this build
        env:
          EXPECTED_INDEX: ${{ needs.build.outputs.index_html }}
          EXPECTED_RSS: ${{ needs.build.outputs.feed_xml }}
          EXPECTED_ICS: ${{ needs.build.outputs.events_ics }}
          EXPECTED_MEETINGS_ICS: ${{ needs.build.outputs.committee_board_ics }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          python3 - <<'PY'
          from concurrent.futures import ThreadPoolExecutor
          from hashlib import sha256
          from urllib.error import URLError, HTTPError
          from urllib.request import Request, urlopen
          import os
          import time

          endpoints = {
              "HTML": ("https://dinop1980.github.io/bblca-events/", os.environ["EXPECTED_INDEX"]),
              "RSS": ("https://dinop1980.github.io/bblca-events/feed.xml", os.environ["EXPECTED_RSS"]),
              "ICS": ("https://dinop1980.github.io/bblca-events/events.ics", os.environ["EXPECTED_ICS"]),
              "MEETINGS ICS": (
                  "https://dinop1980.github.io/bblca-events/committee-board-meetings.ics",
                  os.environ["EXPECTED_MEETINGS_ICS"],
              ),
          }

          def fetch(name, url, expected, attempt):
              separator = "&" if "?" in url else "?"
              cache_busted_url = (
                  f"{url}{separator}verify={os.environ['RUN_ID']}-"
                  f"{os.environ['RUN_ATTEMPT']}-{attempt}"
              )
              request = Request(cache_busted_url, headers={"Cache-Control": "no-cache"})
              try:
                  with urlopen(request, timeout=20) as response:
                      body = response.read()
                  actual = sha256(body).hexdigest()
                  return name, actual == expected, actual, None
              except (HTTPError, URLError, TimeoutError) as error:
                  return name, False, None, str(error)

          for attempt in range(1, 25):
              with ThreadPoolExecutor(max_workers=3) as pool:
                  results = list(pool.map(
                      lambda item: fetch(item[0], item[1][0], item[1][1], attempt),
                      endpoints.items(),
                  ))

              mismatches = []
              for name, matches, actual, error in results:
                  if matches:
                      print(f"{name}: matches this deployment")
                  elif error:
                      mismatches.append(f"{name}: fetch failed: {error}")
                  else:
                      mismatches.append(f"{name}: checksum {actual} does not match this build")

              if not mismatches:
                  print("All public endpoints match the files uploaded by this run.")
                  break

              print(f"Attempt {attempt}/24: " + "; ".join(mismatches))
              if attempt == 24:
                  raise SystemExit(
                      "Public HTML, RSS, and ICS did not all match this deployment "
                      "after 24 checks. The workflow is marked failed so the mismatch "
                      "is visible."
                  )
              time.sleep(15)
          PY

